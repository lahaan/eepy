; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c3-devkitc-02]
platform = espressif32
board = esp32-c3-devkitc-02
framework = espidf
build_src_filter = +<*> -<pico/>
upload_port = /dev/cu.usbmodem21401
monitor_port = /dev/cu.usbmodem21401
monitor_speed = 115200

; RP2350 Pico 2W (wireless, for BT/webapp hub). If you actually have the
; Waveshare RP2350-Zero (no WiFi/BT), change board to waveshare_rp2350_zero.
[env:pico2w]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2w
framework = arduino
build_src_filter = -<*> +<pico/*>
upload_port = /dev/cu.usbmodem21101
monitor_port = /dev/cu.usbmodem21101
monitor_speed = 115200
lib_deps =
  sui77/rc-switch@^2.6.4

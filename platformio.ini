; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Serial ports are auto-detected by USB ID (ESP32-C3 303A:1001 via
; boards/esp32-c3-devkitc-02.json, Pico 2W 2E8A:F00F from its stock board),
; so the same config works on Windows (COMx) and macOS (/dev/cu.usbmodem*).
; With two of the same board plugged in, pass --upload-port / --port.
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c3-devkitc-02]
platform = espressif32
board = esp32-c3-devkitc-02
framework = espidf
build_src_filter = +<*> -<pico/>
; WiFi + NimBLE > 1MB; keep in sync with sdkconfig PARTITION_TABLE_SINGLE_APP_LARGE
board_build.partitions = partitions_singleapp_large.csv
monitor_speed = 115200

; RP2350 Pico 2W (wireless, for BT/webapp hub). If you actually have the
; Waveshare RP2350-Zero (no WiFi/BT), change board to waveshare_rp2350_zero.
[env:pico2w]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2w
framework = arduino
build_src_filter = -<*> +<pico/*>
monitor_speed = 115200
lib_deps =
  sui77/rc-switch@^2.6.4

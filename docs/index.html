<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>eepy probe</title>
<!--
  Phone UI for the ESP32 "eepy-probe" (BLE, Nordic UART Service).
  Protocol: JSON lines, see src/main.c. Commands are plain text lines.
  Also connects to the Pico "eepy-hub" (src/pico/main.cpp): same UUIDs and
  lines, relayed from the probe over 433MHz. Read-only (433 is one-way), no
  SSID or AP list, ~1 sample per 2.5s. ?demo=hub fakes the hub.
  Web Bluetooth needs HTTPS (GitHub Pages) and Chrome on Android.
  Append ?demo to the URL for fake data without hardware.
  Look: late-2000s minimal "sunrise over the earth" (the sun tracks RSSI).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000;
    --text: #eef1f6;
    --muted: #8a93a3;
    --faint: rgba(255, 255, 255, .07);
    --hair: rgba(255, 255, 255, .12);
    --sky: #7fb8ff;          /* atmosphere blue */
    --sun: #ffb24d;          /* sunrise orange */
    /* quality scale: starlight -> gold -> orange -> ember */
    --q-excellent: #fff4dc;
    --q-good: #ffd27a;
    --q-fair: #ffa142;
    --q-weak: #ff6d2e;
    --q-poor: #e8413c;
    --sun-level: .35;        /* 0..1, driven by RSSI */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); }
  body {
    color: var(--text);
    font: 400 15px/1.45 "Quicksand", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ---------- sky (fixed, behind everything) ---------- */
  .sky { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  #stars { position: absolute; inset: 0; width: 100%; height: 100%; }
  /* warm light spilling along the horizon, tilted with it */
  .glow {
    position: absolute; left: var(--sun-x, 60%); top: var(--sun-y, 70%);
    width: 150vmax; height: 38vmax;
    transform: translate(-50%, -50%) rotate(var(--sun-rot, -10deg));
    background: radial-gradient(closest-side, rgba(255, 150, 50, .55), rgba(255, 110, 30, .18) 45%, transparent 75%);
    opacity: calc(.15 + .85 * var(--sun-level));
    mix-blend-mode: screen;
    transition: opacity 1.4s ease;
  }
  /* the sun: hot core + 4-point flare like the cover */
  .sun {
    position: absolute; left: var(--sun-x, 60%); top: var(--sun-y, 70%);
    width: 70vmin; height: 70vmin;
    transform: translate(-50%, -50%) scale(calc(.45 + .7 * var(--sun-level)));
    opacity: calc(.25 + .75 * var(--sun-level));
    mix-blend-mode: screen;
    transition: transform 1.4s ease, opacity 1.4s ease;
  }
  .sun::before {
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(circle, #ffffff 0 3%, rgba(255, 244, 214, .95) 5%,
                rgba(255, 184, 90, .55) 12%, rgba(255, 120, 40, .18) 28%, transparent 55%);
  }
  .ray {
    position: absolute; left: 50%; top: 50%; width: 100%; height: 3px; margin: -1.5px 0 0 -50%;
    background: linear-gradient(90deg, transparent, rgba(255, 214, 150, .55) 35%, #fff 50%,
                rgba(255, 214, 150, .55) 65%, transparent);
    filter: blur(.6px);
  }
  .ray.r1 { transform: rotate(-38deg); }
  .ray.r2 { transform: rotate(38deg); width: 70%; margin-left: -35%; opacity: .7; }
  .ray.r3 { transform: rotate(90deg); width: 55%; margin-left: -27.5%; opacity: .45; }
  @media (prefers-reduced-motion: no-preference) {
    .sun { animation: breathe 7s ease-in-out infinite; }
    @keyframes breathe { 50% { filter: brightness(1.12); } }
  }

  /* ---------- layout ---------- */
  main {
    position: relative; z-index: 1;
    max-width: 560px; margin: 0 auto;
    padding: calc(22px + env(safe-area-inset-top)) 20px calc(40px + env(safe-area-inset-bottom));
  }
  header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .word {
    font-weight: 300; font-size: 44px; line-height: 1; letter-spacing: .5px;
    text-shadow: 0 0 18px rgba(255, 255, 255, .18);
  }
  .sub { margin-top: 8px; font-weight: 300; font-size: 15px; color: #c9d0db; line-height: 1.35; }
  .sub .state { display: flex; align-items: center; gap: 8px; }
  .dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--muted); flex: none;
    transition: background .4s, box-shadow .4s;
  }
  .dot.on { background: var(--sky); box-shadow: 0 0 8px var(--sky), 0 0 16px rgba(127, 184, 255, .6); }

  /* ---------- liquid glass ----------
     Backdrop is refracted through #lg (SVG displacement) + blurred; layers:
     element bg = faint tint, ::before = specular rim (gradient border via
     mask), ::after = sheen that follows the pointer (--mx/--my).
     url() backdrop filters are Chromium-only; others keep the plain blur. */
  .glass {
    position: relative; isolation: isolate;
    color: var(--text);
    border: 0; border-radius: 999px;
    background: rgba(255, 255, 255, .045);
    -webkit-backdrop-filter: blur(6px) saturate(170%);
    backdrop-filter: blur(6px) saturate(170%);
    backdrop-filter: url(#lg) blur(1.5px) saturate(180%) brightness(1.1);
    box-shadow:
      inset 0 1px 1px rgba(255, 255, 255, .28),
      inset 0 -1px 2px rgba(0, 0, 0, .35),
      inset 0 -6px 12px rgba(255, 255, 255, .03),
      0 8px 24px rgba(0, 0, 0, .45);
  }
  .glass::before {
    content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit; padding: 1px;
    background: linear-gradient(var(--rim-angle, 140deg),
      rgba(255, 255, 255, .7), rgba(255, 255, 255, .12) 28%,
      rgba(255, 255, 255, .04) 55%, rgba(255, 255, 255, .45));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
    pointer-events: none;
  }
  .glass::after {
    content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit;
    background:
      radial-gradient(120% 90% at var(--mx, 50%) var(--my, -20%), rgba(255, 255, 255, .2), transparent 55%),
      linear-gradient(180deg, rgba(255, 255, 255, .1), transparent 45%);
    opacity: .9; transition: opacity .3s;
    pointer-events: none;
  }

  button {
    font: 500 14px/1 "Quicksand", system-ui, sans-serif; letter-spacing: .5px;
    text-transform: lowercase; text-shadow: 0 1px 2px rgba(0, 0, 0, .5);
    min-height: 44px; padding: 0 20px; cursor: pointer;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    transition: transform .45s cubic-bezier(.34, 1.56, .64, 1), opacity .25s, box-shadow .3s;
  }
  button:active:not(:disabled) { transform: scale(.94); }
  button:active:not(:disabled)::after { opacity: 1; }
  /* sunrise-tinted rim for the main action */
  button.primary::before {
    background: linear-gradient(var(--rim-angle, 140deg),
      rgba(255, 236, 200, .95), rgba(255, 178, 77, .35) 30%,
      rgba(255, 150, 50, .08) 55%, rgba(255, 190, 110, .7));
  }
  button.primary { box-shadow:
      inset 0 1px 1px rgba(255, 240, 210, .35), inset 0 -1px 2px rgba(0, 0, 0, .35),
      0 8px 24px rgba(0, 0, 0, .45), 0 0 22px rgba(255, 150, 50, .22); }
  button:disabled { opacity: .35; cursor: default; }

  .unsupported { color: var(--q-weak); font-size: 14px; font-weight: 400; margin: 14px 0 0; }

  /* ---------- live readout ---------- */
  .live { margin-top: 38px; }
  .label { font-size: 12px; font-weight: 500; letter-spacing: 2.5px; color: var(--muted); text-transform: lowercase; }
  #ssid {
    margin-top: 6px; font-size: 22px; font-weight: 400;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #meta { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .big { display: flex; align-items: baseline; gap: 10px; margin: 14px 0 0; }
  #rssi {
    font-size: 84px; font-weight: 300; line-height: .9; letter-spacing: -2px;
    font-variant-numeric: tabular-nums;
    transition: color .8s, text-shadow .8s;
  }
  #rssi-unit { color: var(--muted); font-size: 18px; font-weight: 300; }
  .qual { margin-left: auto; text-align: right; }
  #quality { font-size: 15px; font-weight: 500; letter-spacing: 1px; transition: color .8s; }
  #rate { color: var(--muted); font-size: 12px; margin-top: 2px; }
  canvas#chart { width: 100%; height: 130px; display: block; margin-top: 18px; }

  .actions { display: flex; gap: 8px; margin-top: 18px; }
  .actions button { flex: 1; padding: 0 8px; }

  /* ---------- access points ---------- */
  .aps { margin-top: 40px; }
  .aps-head { display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 10px; border-bottom: 1px solid var(--hair); }
  #aps-count { color: var(--muted); font-size: 12px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li.ap {
    display: grid; grid-template-columns: 14px 1fr auto; gap: 0 10px; align-items: center;
    padding: 13px 4px; border-bottom: 1px solid var(--faint); cursor: pointer;
    -webkit-tap-highlight-color: transparent; transition: background .3s;
  }
  li.ap:active { background: rgba(255, 255, 255, .04); }
  .ap-mark { width: 6px; height: 6px; border-radius: 50%; justify-self: center; background: transparent; }
  li.ap.locked .ap-mark { background: var(--sun); box-shadow: 0 0 8px var(--sun), 0 0 18px rgba(255, 150, 50, .7); }
  .ap-main { min-width: 0; }
  .ap-name { font-size: 16px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li.ap.locked .ap-name { text-shadow: 0 0 12px rgba(255, 190, 110, .45); }
  .ap-sub { color: var(--muted); font-size: 12px; letter-spacing: .3px; margin-top: 1px; }
  .ap-rssi { font-size: 18px; font-weight: 400; font-variant-numeric: tabular-nums; }
  .empty { color: var(--muted); padding: 14px 4px; font-weight: 300; }

  /* ---------- log / toast ---------- */
  details { margin-top: 36px; }
  details summary { cursor: pointer; list-style: none; }
  details summary::-webkit-details-marker { display: none; }
  details summary::after { content: " +"; color: var(--muted); }
  details[open] summary::after { content: " –"; }
  #log {
    margin: 10px 0 0; max-height: 220px; overflow: auto;
    font: 11px/1.4 ui-monospace, Consolas, monospace; color: #6f7888;
    white-space: pre-wrap; word-break: break-all;
  }
  #toast {
    position: fixed; z-index: 2; left: 20px; right: 20px; bottom: calc(22px + env(safe-area-inset-bottom));
    max-width: 520px; margin: 0 auto; text-align: center;
    padding: 12px 18px; font-size: 14px;
    background: rgba(10, 12, 20, .35);
    opacity: 0; transform: translateY(6px); transition: opacity .25s, transform .25s; pointer-events: none;
  }
  #toast.show { opacity: 1; transform: none; }
  footer { margin-top: 40px; color: #4d5463; font-size: 11px; letter-spacing: 2px; text-align: center; }
</style>
</head>
<body>
<!-- liquid glass refraction: low-frequency noise bends the backdrop -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="lg" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.011 0.02" numOctaves="2" seed="4" result="noise"/>
    <feGaussianBlur in="noise" stdDeviation="1.5" result="soft"/>
    <feDisplacementMap in="SourceGraphic" in2="soft" scale="22" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
<div class="sky" aria-hidden="true">
  <canvas id="stars"></canvas>
  <div class="glow"></div>
  <div class="sun"><div class="ray r1"></div><div class="ray r2"></div><div class="ray r3"></div></div>
</div>

<main>
  <header>
    <div>
      <div class="word">eepy</div>
      <div class="sub">
        <div>wifi probe</div>
        <div class="state"><span class="dot" id="dot"></span><span id="status">not connected</span></div>
      </div>
    </div>
    <button class="glass primary" id="connect">connect</button>
  </header>
  <p class="unsupported" id="unsupported" hidden>
    web bluetooth isn't available here. use chrome on android over https,
    or add <code>?demo</code> to the url to try the ui.
  </p>

  <section class="live">
    <div class="label">locked on</div>
    <div id="ssid">—</div>
    <div id="meta">&nbsp;</div>
    <div class="big">
      <span id="rssi">--</span><span id="rssi-unit">dBm</span>
      <div class="qual"><div id="quality">&nbsp;</div><div id="rate">&nbsp;</div></div>
    </div>
    <canvas id="chart" aria-label="signal over the last minute"></canvas>
    <div class="actions">
      <button class="glass" data-cmd="next" disabled>next</button>
      <button class="glass" data-cmd="scan" disabled>rescan</button>
      <button class="glass" data-cmd="auto" disabled>strongest</button>
    </div>
  </section>

  <section class="aps">
    <div class="aps-head"><span class="label">access points</span><span id="aps-count"></span></div>
    <ul id="aps"><li class="empty">connect to see the scan list. tap an ap to lock onto it.</li></ul>
  </section>

  <details>
    <summary class="label">raw log</summary>
    <pre id="log"></pre>
  </details>

  <footer>eepy · esp32-c3 · pico 2w · 433</footer>
</main>

<div id="toast" class="glass" role="status"></div>

<script>
'use strict';
const NUS = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
const NUS_RX = '6e400002-b5a3-f393-e0a9-e50e24dcca9e'; // we write commands
const NUS_TX = '6e400003-b5a3-f393-e0a9-e50e24dcca9e'; // probe notifies lines
const HISTORY = 120;        // samples kept for the chart (~60s at 2Hz)
const Y_MIN = -100, Y_MAX = -30;
const GOOD_LINE = -67;      // common "good enough for voice" survey threshold

const $ = id => document.getElementById(id);
const root = document.documentElement;
const state = { aps: [], lock: null, hist: [], connected: false, role: 'probe' };
let device = null, rxChar = null, lineBuf = '', wakeLock = null;
const enc = new TextEncoder(), dec = new TextDecoder();
const demo = new URLSearchParams(location.search).has('demo');
const demoHub = new URLSearchParams(location.search).get('demo') === 'hub';
const isHub = () => state.role === 'hub';

// ---------- sky ----------

// Stars + earth limb drawn once per resize; the sun/glow are DOM layers
// positioned on the limb and brightened by --sun-level (RSSI).
function drawSky() {
  const c = $('stars'), dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = window.innerWidth, h = window.innerHeight;
  if (!w || !h) return; // hidden/background tab: no size yet, resize redraws
  c.width = w * dpr; c.height = h * dpr;
  const g = c.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.fillStyle = '#000';
  g.fillRect(0, 0, w, h);

  // deterministic stars so they don't reshuffle on every resize
  let seed = 7;
  const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  const n = Math.round(w * h / 2200);
  for (let i = 0; i < n; i++) {
    const x = rnd() * w, y = rnd() * h * 0.85, r = rnd() < 0.92 ? rnd() * 0.8 + 0.2 : rnd() * 1.1 + 0.8;
    const a = 0.25 + rnd() * 0.75, blue = rnd() < 0.2;
    g.fillStyle = blue ? `rgba(170,190,255,${a})` : `rgba(255,255,255,${a})`;
    g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  }

  // Earth: huge circle whose centre sits off to the lower right, so the
  // visible limb rises gently left -> right like the cover.
  const R = Math.max(w, h) * 2.4;
  const cx = w * 1.35, cy = h * 0.76 + R;
  const limbY = x => cy - Math.sqrt(R * R - (x - cx) * (x - cx));
  const sunX = w * 0.56, sunY = limbY(sunX);

  const earth = g.createRadialGradient(sunX, sunY, 0, sunX, sunY, h * 0.6);
  earth.addColorStop(0, '#1a1208');
  earth.addColorStop(0.35, '#07080b');
  earth.addColorStop(1, '#020203');
  g.fillStyle = earth;
  g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2); g.fill();

  // atmosphere: wide soft blue band, then the thin bright rim
  const rim = g.createLinearGradient(0, 0, w, 0);
  rim.addColorStop(0, 'rgba(90,150,255,.9)');
  rim.addColorStop(sunX / w - 0.18, 'rgba(160,200,255,.95)');
  rim.addColorStop(sunX / w, 'rgba(255,240,210,1)');
  rim.addColorStop(sunX / w + 0.2, 'rgba(255,200,120,.9)');
  rim.addColorStop(1, 'rgba(120,170,255,.8)');
  g.save();
  g.strokeStyle = rim;
  g.globalAlpha = 0.18; g.lineWidth = 16; g.filter = 'blur(6px)';
  g.beginPath(); g.arc(cx, cy, R + 4, 0, Math.PI * 2); g.stroke();
  g.filter = 'none'; g.globalAlpha = 1; g.lineWidth = 1.6;
  g.shadowColor = 'rgba(140,190,255,.9)'; g.shadowBlur = 10;
  g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2); g.stroke();
  g.restore();

  const slope = (sunX - cx) / Math.sqrt(R * R - (sunX - cx) * (sunX - cx)); // dy/dx
  root.style.setProperty('--sun-x', sunX + 'px');
  root.style.setProperty('--sun-y', sunY + 'px');
  root.style.setProperty('--sun-rot', (Math.atan(-slope) * 180 / Math.PI).toFixed(1) + 'deg');
}

function setSun(rssi) {
  const lvl = rssi == null ? 0.08 : Math.max(0, Math.min(1, (rssi + 95) / 60));
  root.style.setProperty('--sun-level', lvl.toFixed(3));
}

// ---------- UI helpers ----------

function quality(r) {
  if (r == null) return { label: '', color: 'var(--muted)' };
  if (r >= -60) return { label: 'excellent', color: 'var(--q-excellent)' };
  if (r >= -67) return { label: 'good', color: 'var(--q-good)' };
  if (r >= -75) return { label: 'fair', color: 'var(--q-fair)' };
  if (r >= -85) return { label: 'weak', color: 'var(--q-weak)' };
  return { label: 'poor', color: 'var(--q-poor)' };
}

let toastTimer;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}

function log(line) {
  const el = $('log');
  el.textContent += line + '\n';
  if (el.textContent.length > 20000) el.textContent = el.textContent.slice(-15000);
  el.scrollTop = el.scrollHeight;
}

function setConnected(on, text) {
  state.connected = on;
  $('dot').classList.toggle('on', on);
  $('status').textContent = text;
  $('connect').textContent = on ? 'disconnect' : 'connect';
  $('connect').classList.toggle('primary', !on);
  document.querySelectorAll('[data-cmd]').forEach(b => (b.disabled = !on || isHub()));
  if (!on) setSun(null);
}

function renderAps() {
  const ul = $('aps');
  $('aps-count').textContent = state.aps.length ? `${state.aps.length} found \u00b7 rssi at scan, locked live` : '';
  if (!state.aps.length) {
    ul.innerHTML = isHub()
      ? '<li class="empty">the hub only relays the locked ap. connect to eepy-probe for the list and controls.</li>'
      : '<li class="empty">no scan list yet.</li>';
    return;
  }
  ul.replaceChildren(...state.aps.map(ap => {
    const li = document.createElement('li');
    li.className = 'ap' + (state.lock && state.lock.bssid === ap.bssid ? ' locked' : '');
    const mark = document.createElement('span');
    mark.className = 'ap-mark';
    const main = document.createElement('div');
    main.className = 'ap-main';
    const name = document.createElement('div');
    name.className = 'ap-name';
    name.textContent = ap.ssid;                 // SSIDs keep their real case
    const sub = document.createElement('div');
    sub.className = 'ap-sub';
    sub.textContent = `${ap.bssid} · ch ${ap.ch}${ap.enc ? ' · secured' : ' · open'}`;
    main.append(name, sub);
    const r = document.createElement('div');
    r.className = 'ap-rssi';
    r.textContent = ap.rssi;
    r.style.color = quality(ap.rssi).color;
    li.append(mark, main, r);
    li.onclick = () => send(`lock ${ap.bssid}`);
    return li;
  }));
}

function renderLive(s) {
  const lk = state.lock;
  $('ssid').textContent = lk ? (lk.ssid || `ap ${lk.i} of ${lk.n}`) : '—';
  $('meta').textContent = lk ? `channel ${lk.ch} · ${lk.i} of ${lk.n}${lk.src === 'rf' ? ' · via 433' : ''}` : ' ';
  const r = s ? s.rssi : null;
  const q = quality(r);
  $('rssi').textContent = r == null ? '--' : r;
  $('rssi').style.color = r == null ? 'var(--muted)' : q.color;
  $('rssi').style.textShadow = r == null ? 'none' : `0 0 22px ${q.color}55`;
  $('quality').textContent = q.label || ' ';
  $('quality').style.color = q.color;
  $('rate').textContent = !s ? ' '
    : s.src === 'rf' ? `433 relay · seq ${s.seq}`
    : s.rssi == null ? 'no beacons' : `${s.rate} beacons/s`;
  if (s) setSun(r);
  drawChart();
}

function drawChart() {
  const c = $('chart'), dpr = window.devicePixelRatio || 1;
  const w = c.clientWidth, h = c.clientHeight;
  if (c.width !== Math.round(w * dpr)) { c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); }
  const g = c.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);
  const padL = 30, padR = 2, padT = 8, padB = 6;
  const y = v => padT + (Y_MAX - v) / (Y_MAX - Y_MIN) * (h - padT - padB);
  const x = i => padL + i / (HISTORY - 1) * (w - padL - padR);

  g.font = '300 10px Quicksand, system-ui, sans-serif';
  g.textAlign = 'right';
  g.textBaseline = 'middle';
  for (const v of [-40, -60, -80, -100]) {
    g.strokeStyle = 'rgba(255,255,255,.06)';
    g.lineWidth = 1;
    g.beginPath(); g.moveTo(padL, y(v)); g.lineTo(w - padR, y(v)); g.stroke();
    g.fillStyle = '#5d6574';
    g.fillText(v, padL - 6, y(v));
  }
  // the "horizon": -67dBm voice-grade line in atmosphere blue
  g.save();
  g.setLineDash([2, 5]);
  g.strokeStyle = 'rgba(127,184,255,.7)';
  g.shadowColor = 'rgba(127,184,255,.8)'; g.shadowBlur = 6;
  g.beginPath(); g.moveTo(padL, y(GOOD_LINE)); g.lineTo(w - padR, y(GOOD_LINE)); g.stroke();
  g.restore();

  // continuous runs (gaps = lost beacons)
  const off = HISTORY - state.hist.length, runs = [];
  let run = null;
  state.hist.forEach((v, i) => {
    if (v == null) { run = null; return; }
    if (!run) runs.push((run = []));
    run.push([x(i + off), y(Math.max(Y_MIN, Math.min(Y_MAX, v)))]);
  });

  const lineGrad = g.createLinearGradient(0, y(Y_MAX), 0, y(Y_MIN));
  lineGrad.addColorStop(0, '#fff4dc');
  lineGrad.addColorStop(0.45, '#ffb24d');
  lineGrad.addColorStop(1, '#e8413c');
  const fillGrad = g.createLinearGradient(0, padT, 0, h);
  fillGrad.addColorStop(0, 'rgba(255,170,70,.22)');
  fillGrad.addColorStop(1, 'rgba(255,120,40,0)');

  for (const pts of runs) {
    g.beginPath();
    pts.forEach(([px, py], k) => (k ? g.lineTo(px, py) : g.moveTo(px, py)));
    g.lineTo(pts[pts.length - 1][0], h);
    g.lineTo(pts[0][0], h);
    g.closePath();
    g.fillStyle = fillGrad;
    g.fill();

    g.save();
    g.beginPath();
    pts.forEach(([px, py], k) => (k ? g.lineTo(px, py) : g.moveTo(px, py)));
    g.strokeStyle = lineGrad;
    g.lineWidth = 1.8;
    g.lineJoin = 'round';
    g.shadowColor = 'rgba(255,160,60,.8)'; g.shadowBlur = 8;
    g.stroke();
    g.restore();
  }
  // newest point as a small star
  const last = runs.length && runs[runs.length - 1];
  if (last && state.hist[state.hist.length - 1] != null) {
    const [px, py] = last[last.length - 1];
    g.save();
    g.fillStyle = '#fff';
    g.shadowColor = '#ffb24d'; g.shadowBlur = 12;
    g.beginPath(); g.arc(px, py, 2.4, 0, Math.PI * 2); g.fill();
    g.restore();
  }
}

// ---------- protocol ----------

function handle(msg) {
  switch (msg.t) {
    case 'ap':
      if (msg.i === 1) state.aps = [];
      state.aps[msg.i - 1] = msg;
      renderAps();
      break;
    case 'lock':
      if (!state.lock || state.lock.bssid !== msg.bssid) state.hist = [];
      state.lock = msg;
      renderAps();
      renderLive(null);
      break;
    case 's': {
      // List RSSIs come from the last scan; only the locked AP is sniffed live.
      const ap = state.lock && state.aps.find(a => a && a.bssid === state.lock.bssid);
      if (ap && msg.rssi != null && ap.rssi !== msg.rssi) {
        ap.rssi = msg.rssi;
        renderAps();
      }
      state.hist.push(msg.rssi);
      if (state.hist.length > HISTORY) state.hist.shift();
      renderLive(msg);
      break;
    }
    case 'hello':
      state.role = msg.role === 'hub' ? 'hub' : 'probe';
      setConnected(true, connectedText());
      renderAps();
      break;
    case 'err':
      toast(msg.msg);
      break;
    case 'help':
      toast(msg.cmds);
      break;
  }
}

// Notifications are MTU-sized chunks; reassemble on '\n'.
function feed(text) {
  lineBuf += text;
  let nl;
  while ((nl = lineBuf.indexOf('\n')) >= 0) {
    const line = lineBuf.slice(0, nl).trim();
    lineBuf = lineBuf.slice(nl + 1);
    if (!line) continue;
    log(line);
    if (line[0] !== '{') continue;
    try { handle(JSON.parse(line)); } catch (e) { log('! bad json: ' + e.message); }
  }
}

async function send(cmd) {
  log('> ' + cmd);
  if (demo) return demoCmd(cmd);
  if (!rxChar) return;
  try {
    await rxChar.writeValueWithoutResponse(enc.encode(cmd + '\n'));
  } catch (e) {
    toast('send failed: ' + e.message);
  }
}

// ---------- BLE ----------

async function keepAwake() {
  try { wakeLock = await navigator.wakeLock?.request('screen'); } catch (_) {}
}

function connectedText() {
  const name = device?.name || (demoHub ? 'eepy-hub' : 'eepy-probe');
  return isHub() ? `connected · ${name} · read-only via 433` : `connected · ${name}`;
}

async function connectGatt() {
  // The hub also says hello once subscribed; the name is a head start.
  state.role = (device.name || '').startsWith('eepy-hub') ? 'hub' : 'probe';
  state.aps = []; state.lock = null; state.hist = [];
  renderAps(); renderLive(null);
  setConnected(false, `connecting to ${device.name || 'probe'}…`);
  const server = await device.gatt.connect();
  const svc = await server.getPrimaryService(NUS);
  rxChar = await svc.getCharacteristic(NUS_RX);
  const txChar = await svc.getCharacteristic(NUS_TX);
  txChar.addEventListener('characteristicvaluechanged', e => feed(dec.decode(e.target.value)));
  lineBuf = '';
  await txChar.startNotifications(); // probe sends the AP list once subscribed
  setConnected(true, connectedText());
  keepAwake();
}

async function onConnectClick() {
  if (demo) return demoStart();
  if (state.connected) {
    device.gatt.disconnect();
    return;
  }
  try {
    if (!device) {
      device = await navigator.bluetooth.requestDevice({
        filters: [{ services: [NUS] }, { namePrefix: 'eepy' }],
        optionalServices: [NUS],
      });
      device.addEventListener('gattserverdisconnected', () => {
        rxChar = null;
        device = null; // next connect opens the picker, so hub <-> probe can switch
        setConnected(false, 'disconnected');
        wakeLock?.release?.();
      });
    }
    await connectGatt();
  } catch (e) {
    if (e.name !== 'NotFoundError') toast(e.message); // NotFound = picker cancelled
    device = null;
    setConnected(false, 'not connected');
  }
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && state.connected) keepAwake();
});

// ---------- demo mode (?demo): fake probe, no hardware ----------

let demoTimer = null;
const demoAps = [
  { bssid: '34:60:f9:2a:09:2c', ch: 1, rssi: -55, enc: 1, ssid: 'C6' },
  { bssid: '36:60:f9:2a:09:2c', ch: 1, rssi: -56, enc: 1, ssid: '<hidden>' },
  { bssid: '20:1f:31:c8:49:2f', ch: 6, rssi: -88, enc: 1, ssid: 'Elion' },
  { bssid: 'a4:2b:b0:11:22:33', ch: 11, rssi: -71, enc: 0, ssid: 'Cafe Guest' },
];
let demoCur = 0, demoSeq = 0, demoT = 0;

function demoEmit(o) { feed(JSON.stringify(o) + '\n'); }
function demoList() {
  demoAps.forEach((a, i) => demoEmit({ t: 'ap', i: i + 1, n: demoAps.length, ...a }));
  demoLock();
}
function demoLock() {
  const a = demoAps[demoCur];
  demoEmit({ t: 'lock', i: demoCur + 1, n: demoAps.length, bssid: a.bssid, ch: a.ch, ssid: a.ssid });
}
function demoCmd(cmd) {
  const [c, arg] = cmd.split(' ');
  if (c === 'next') demoCur = (demoCur + 1) % demoAps.length;
  else if (c === 'auto') demoCur = 0;
  else if (c === 'lock') {
    const i = demoAps.findIndex(a => a.bssid === arg);
    if (i < 0) return demoEmit({ t: 'err', msg: 'lock: no such AP (use list)' });
    demoCur = i;
  }
  if (c === 'scan' || c === 'auto') demoList(); else demoLock();
  demoEmit({ t: 'ok', cmd: c });
}
function demoStart() {
  if (demoTimer) {
    clearInterval(demoTimer); demoTimer = null;
    setConnected(false, 'disconnected · demo');
    return;
  }
  if (demoHub) return demoHubStart();
  setConnected(true, 'demo · eepy-probe');
  demoList();
  demoTimer = setInterval(() => {
    demoT += 0.5;
    const base = demoAps[demoCur].rssi;
    const lost = Math.random() < 0.03;
    const r = lost ? null : Math.round(base + 6 * Math.sin(demoT / 4) + (Math.random() * 4 - 2));
    if (demoT % 2.5 === 0) demoSeq++;
    demoEmit({ t: 's', src: 'ble', seq: demoSeq, i: demoCur + 1, n: demoAps.length,
               rssi: r, rate: lost ? 0 : 8 + Math.round(Math.random() * 2), ch: demoAps[demoCur].ch });
  }, 500);
}

// Fake Pico relay: no list, no SSID, one sample per 2.5s.
function demoHubStart() {
  state.role = 'hub';
  setConnected(true, 'demo · eepy-hub · read-only via 433');
  demoEmit({ t: 'hello', role: 'hub', got: 0 });
  const a = demoAps[0];
  demoEmit({ t: 'lock', src: 'rf', i: 1, n: demoAps.length, bssid: `rf-1-${a.ch}`, ch: a.ch, ssid: '' });
  demoTimer = setInterval(() => {
    demoT += 2.5; demoSeq++;
    const r = Math.round(a.rssi + 6 * Math.sin(demoT / 10) + (Math.random() * 4 - 2));
    demoEmit({ t: 's', src: 'rf', seq: demoSeq, i: 1, n: demoAps.length, rssi: r,
               ch: a.ch, lock: 1, got: demoSeq, age: 0 });
  }, 2500);
}

// ---------- boot ----------

$('connect').onclick = onConnectClick;
// liquid glass: sheen tracks the finger/cursor, rim light tilts with it
document.querySelectorAll('button.glass').forEach(b => {
  const track = e => {
    const r = b.getBoundingClientRect();
    const mx = (e.clientX - r.left) / r.width * 100, my = (e.clientY - r.top) / r.height * 100;
    b.style.setProperty('--mx', mx.toFixed(1) + '%');
    b.style.setProperty('--my', my.toFixed(1) + '%');
    b.style.setProperty('--rim-angle', (110 + (mx - 50) * 0.8).toFixed(0) + 'deg');
  };
  b.addEventListener('pointermove', track);
  b.addEventListener('pointerdown', track);
  b.addEventListener('pointerleave', () => {
    b.style.removeProperty('--mx'); b.style.removeProperty('--my'); b.style.removeProperty('--rim-angle');
  });
});
document.querySelectorAll('[data-cmd]').forEach(b => (b.onclick = () => send(b.dataset.cmd)));
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { drawSky(); drawChart(); }, 120);
});
if (!demo && !navigator.bluetooth) {
  $('unsupported').hidden = false;
  $('connect').disabled = true;
}
if (demo) $('status').textContent = 'demo mode · tap connect';
drawSky();
renderLive(null);
root.style.setProperty('--sun-level', '.35'); // resting sunrise before any data
document.fonts?.ready.then(drawChart);
</script>
</body>
